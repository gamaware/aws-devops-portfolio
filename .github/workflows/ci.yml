name: ci

# Thin caller: shared checks come from gamaware/.github; `make verify` is the same command contributors run locally.
# No job receives cloud credentials or an id-token.
# The weekly run catches a listed repository that moved or deleted its artifact or cover since the last change here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-docs:
    name: lint-docs
    uses: gamaware/.github/.github/workflows/lint-docs.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # gamaware/.github main (#2)
    permissions:
      contents: read # checkout
    with:
      vale-paths: README.md CLAUDE.md CHANGELOG.md SECURITY.md docs .github
      # Upwork answers bots with 403, so its profile URLs are excluded; GitHub may rate-limit with 429.
      # Every other link must resolve with a 2xx status.
      lychee-args: >-
        --no-progress --max-retries 3 --accept 200..=299,429
        --exclude '^https://www\.upwork\.com/freelancers/' './**/*.md'

  lint-actions:
    name: lint-actions
    uses: gamaware/.github/.github/workflows/lint-actions.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # gamaware/.github main (#2)
    permissions:
      contents: read # checkout

  secrets:
    name: secrets
    uses: gamaware/.github/.github/workflows/secrets.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # gamaware/.github main (#2)
    permissions:
      contents: read # checkout

  security:
    name: security
    uses: gamaware/.github/.github/workflows/security.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # gamaware/.github main (#2)
    permissions:
      contents: read # checkout

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Clone the listed repositories
        run: REPOS_ROOT="$RUNNER_TEMP/repos" scripts/clone-siblings.sh

      - name: Run make verify
        run: make verify REPOS_ROOT="$RUNNER_TEMP/repos"
