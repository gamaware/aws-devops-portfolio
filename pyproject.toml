[project]
name = "aws-devops-portfolio"
version = "1.0.0"
description = "Index of an AWS and DevOps portfolio with a catalog-driven consistency check."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pillow==12.3.0", "pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { ruff = false }
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
